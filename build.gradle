buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://maven.parchmentmc.org' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        maven { url = 'https://maven.shedaniel.me/' }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '[6.0.16,6.2)', changing: true
        classpath 'org.parchmentmc:librarian:1.+'
        classpath group: 'org.spongepowered', name: 'mixingradle', version: '0.7-SNAPSHOT'
        classpath 'gradle.plugin.com.github.johnrengelman:shadow:7.1.2'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.parchmentmc.librarian.forgegradle'
apply plugin: 'eclipse'
apply plugin: 'org.spongepowered.mixin'
apply plugin: 'com.github.johnrengelman.shadow'
apply plugin: 'java'

version = project.mod_version
group = project.mod_group_id
base {
    archivesName = project.mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        name = 'Maven-Shedaniel'
        url = 'https://maven.shedaniel.me/'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf("me.shedaniel.cloth:cloth-config-forge:11.1.136")
    implementation files('buildscript_lib/netmusic-1.5.1-forge+mc1.20.1.jar')
    implementation files('buildscript_lib/touhou-little-maid-1.5.2-forge+mc1.20.1.jar')
    implementation files('buildscript_lib/qrcodegen-1.8.0.jar')
    // NetMusicDisplay 兼容层 compileOnly（可选依赖：编译期用于解析 mixin 目标类与生成 refmap，
    // 运行时由 NetMusicDisplay 模组自身提供，不打包进本 mod，避免类冲突）
    compileOnly files('buildscript_lib/NetMusicDisplay-1.1.0-1.20.1-Forge.jar')
    // Create 仅编译期需要（displayLink 的 DisplayLinkContext / DisplayTargetStats 类型）。
    // Forge 版 Create 发布为 SRG 混淆，必须用 fg.deobf 反混淆才能在 mixin 里调用
    // context.blockEntity().getSourcePosition() 等方法。
    compileOnly fg.deobf(files('buildscript_lib/create-1.20.1-6.0.8.jar'))
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.named('processResources', ProcessResources).configure {
    // 强制使用 UTF-8 处理 mods.toml，避免中文在 Windows GBK 环境下乱码
    filteringCharset = 'UTF-8'
    var replaceProperties = [
        minecraft_version   : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        forge_version       : forge_version,
        forge_version_range: forge_version_range,
        loader_version_range: loader_version_range,
        mod_id              : mod_id,
        mod_name            : mod_name,
        mod_license         : mod_license,
        mod_version         : mod_version,
        mod_authors         : mod_authors,
        mod_description     : mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-source', '16', '-target', '16']
}

// 把 qrcodegen（二维码生成库）打进 mod jar，否则运行时 NoClassDefFoundError: io/nayuki/qrcodegen/QrCode$Ecc
// （对齐 1.21.1 版本的做法：jar 任务 from 包含 io/nayuki/qrcodegen 的类）
jar {
    from(zipTree('buildscript_lib/qrcodegen-1.8.0.jar')) {
        include 'io/nayuki/qrcodegen/**'
    }
}

tasks.register('copyToMods') {
    dependsOn 'reobfJar'
    doLast {
        def targetDir = file('D:\\pcl ce\\0-1\\.minecraft\\versions\\1.20.1modstest\\mods')
        def source = file("$buildDir/reobfJar/output.jar")
        if (!source.exists()) {
            println "[NetMusicKuGou] WARN: Source JAR not found: $source"
            return
        }
        try {
            // 清理旧版本 netmusic_kugou jar，避免残留旧 jar（如旧 -beta- 文件名）导致加载冲突
            targetDir.listFiles()?.findAll { it.isFile() && it.name.toLowerCase().startsWith('netmusic_kugou') && it.name.toLowerCase().endsWith('.jar') }?.each { oldJar ->
                println "[NetMusicKuGou] Removing old JAR: ${oldJar.absolutePath}"
                oldJar.delete()
            }
            def targetJar = new File(targetDir, "netmusic_kugou-${version}.jar")
            ant.copy(file: source.absolutePath, tofile: targetJar.absolutePath, overwrite: true)
            println "[NetMusicKuGou] Copied JAR to ${targetJar.absolutePath} (${source.length()} bytes)"
        } catch (Exception e) {
            println "[NetMusicKuGou] WARN: Failed to copy to mods (probably locked by PCL2): ${e.message}"
        }
    }
}
